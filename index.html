<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>For Lystiani Vania Lalita</title>

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Libre+Barcode+39+Text&display=swap"
      rel="stylesheet"
    />

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
      :root {
        --pink-dark: #880e4f;
        --pink-main: #f50057;
        --pink-soft: #ff80ab;
        --pink-light: #fce4ec;
        --grad-1: #ff9a9e;
        --grad-2: #fecfef;
        --grad-3: #ff758c;
        --card-bg: rgba(255, 255, 255, 0.2);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100%;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch; /* Smooth scroll khusus iOS & Android */
      }

      body {
        font-family: "Playfair Display", serif;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        background: linear-gradient(
          135deg,
          var(--grad-1),
          var(--grad-3),
          #ff4081
        );
        background-size: 300% 300%;
        animation: gradientMove 15s ease infinite;
        transition: background 2s ease;
        position: relative;
        color: #fff;
        padding: 30px 0;
      }

      body.morning-theme {
        background: linear-gradient(
          135deg,
          var(--pink-light),
          var(--grad-2),
          var(--grad-1)
        );
        background-size: 300% 300%;
      }

      @keyframes gradientMove {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      #cover {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(136, 14, 79, 0.9);
        backdrop-filter: blur(10px);
        z-index: 10000;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        transition: opacity 1s ease;
      }

      .heart-btn {
        font-size: 6rem;
        cursor: pointer;
        animation: heartbeat 1.5s infinite;
        filter: drop-shadow(0 0 25px var(--pink-soft));
      }

      @keyframes heartbeat {
        0%,
        100% {
          transform: scale(1);
        }
        25% {
          transform: scale(1.15);
        }
        50% {
          transform: scale(1);
        }
        75% {
          transform: scale(1.25);
        }
      }

      .tap-text {
        margin-top: 20px;
        font-family: "Great Vibes", cursive;
        font-size: 2.2rem;
        color: var(--pink-light);
        letter-spacing: 2px;
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
      }

      .magic-sparkle {
        position: absolute;
        pointer-events: none;
        z-index: 9998;
        font-size: 16px;
        animation: floatUp 1s ease-out forwards;
      }

      @keyframes floatUp {
        0% {
          opacity: 1;
          transform: translateY(0) scale(1) rotate(0deg);
        }
        100% {
          opacity: 0;
          transform: translateY(-50px) scale(0.5) rotate(90deg);
        }
      }

      .falling-petal {
        position: fixed;
        top: -5%;
        width: 15px;
        height: 15px;
        background: var(--pink-main);
        border-radius: 15px 0 15px 0;
        pointer-events: none;
        z-index: 0;
        animation: fall linear forwards;
        opacity: 0.5;
        filter: drop-shadow(0 0 5px rgba(245, 0, 87, 0.3));
      }

      @keyframes fall {
        to {
          transform: translateY(110vh) rotate(720deg);
        }
      }

      .container {
        width: 100%;
        max-width: 420px;
        padding: 20px;
        margin: auto;
        perspective: 1000px;
        z-index: 10;
      }

      .glass-card {
        background: var(--card-bg);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 28px;
        padding: 35px 25px;
        box-shadow:
          0 25px 50px rgba(136, 14, 79, 0.25),
          inset 0 0 20px rgba(255, 255, 255, 0.2);
        animation: floatCard 6s ease-in-out infinite;
        transform-style: preserve-3d;
        width: 100%;
        overflow: hidden;
      }

      @keyframes floatCard {
        0%,
        100% {
          transform: translateY(0) rotateX(1deg) rotateY(-1deg);
        }
        50% {
          transform: translateY(-10px) rotateX(-1deg) rotateY(1deg);
        }
      }

      .phase {
        display: none;
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .phase.active {
        display: block;
        opacity: 1;
        transform: translateY(0);
      }

      h1.title {
        font-family: "Great Vibes", cursive;
        font-size: clamp(2rem, 8vw, 2.6rem);
        text-align: center;
        color: #fff;
        text-shadow: 2px 2px 5px rgba(136, 14, 79, 0.5);
        line-height: 1.3;
        margin-bottom: 25px;
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow-wrap: break-word;
        width: 100%;
      }

      .polaroid-wrapper {
        display: flex;
        justify-content: center;
        margin-bottom: 25px;
        animation: gentleSwing 5s ease-in-out infinite;
        transform-origin: top center;
      }

      @keyframes gentleSwing {
        0%,
        100% {
          transform: rotate(-3deg);
        }
        50% {
          transform: rotate(3deg);
        }
      }

      .polaroid {
        background: #fff;
        padding: 10px 10px 30px 10px;
        border-radius: 4px;
        box-shadow: 0 10px 25px rgba(136, 14, 79, 0.25);
        position: relative;
      }

      .polaroid img {
        width: 160px;
        height: 160px;
        object-fit: cover;
        border: 1px solid #ffe4e1;
        border-radius: 2px;
      }

      .tape {
        position: absolute;
        top: -12px;
        left: 50%;
        transform: translateX(-50%) rotate(-2deg);
        width: 70px;
        height: 25px;
        background-color: rgba(255, 192, 203, 0.6);
        backdrop-filter: blur(2px);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        z-index: 2;
      }

      .typewriter-box {
        font-size: 1rem;
        line-height: 1.7;
        text-align: center;
        margin-bottom: 25px;
        text-shadow: 1px 1px 3px rgba(136, 14, 79, 0.6);
        min-height: 190px;
        font-weight: 500;
      }

      .cursor {
        display: inline-block;
        width: 2px;
        height: 1.2em;
        background: #fff;
        animation: blink 1s infinite;
        vertical-align: bottom;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .promise-list {
        background: rgba(255, 255, 255, 0.25);
        border-radius: 18px;
        padding: 18px;
        margin-bottom: 25px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.1);
      }

      .promise-item {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.95rem;
        text-shadow: 1px 1px 2px rgba(136, 14, 79, 0.4);
        padding: 5px;
        border-radius: 10px;
        transition: background 0.3s;
      }

      .promise-item:active {
        background: rgba(255, 255, 255, 0.3);
      }
      .promise-item:last-child {
        margin-bottom: 0;
      }
      .promise-item input {
        display: none;
      }

      .heart-icon {
        font-size: 1.6rem;
        margin-right: 12px;
        transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        color: #fff;
        line-height: 1;
      }

      .promise-item input:checked + .heart-icon {
        color: var(--pink-main);
        transform: scale(1.3);
      }

      .btn-group {
        display: flex;
        gap: 15px;
        justify-content: center;
        position: relative;
      }

      .btn {
        font-family: "Playfair Display", serif;
        font-size: 1.05rem;
        font-weight: 700;
        padding: 14px 20px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: all 0.3s;
        outline: none;
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--pink-main), var(--grad-3));
        color: white;
        box-shadow: 0 5px 20px rgba(245, 0, 87, 0.5);
      }

      .btn-primary:not(:disabled):active {
        transform: scale(0.95);
      }
      .btn-primary:disabled {
        background: rgba(255, 255, 255, 0.4);
        color: rgba(255, 255, 255, 0.8);
        box-shadow: none;
      }

      .btn-primary.glow {
        animation: btnGlow 1.5s infinite alternate;
      }

      @keyframes btnGlow {
        from {
          box-shadow: 0 0 10px var(--pink-soft);
        }
        to {
          box-shadow:
            0 0 25px var(--pink-main),
            0 0 10px #fff;
        }
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.95);
        color: var(--pink-main);
        position: relative;
        z-index: 20;
        transition: transform 0.2s ease-out;
      }

      .form-group {
        position: relative;
        margin-bottom: 25px;
      }

      .form-control {
        width: 100%;
        padding: 20px 15px 10px;
        border: none;
        border-bottom: 2px solid rgba(255, 255, 255, 0.7);
        background: rgba(255, 255, 255, 0.2);
        border-radius: 12px 12px 0 0;
        font-family: "Playfair Display", serif;
        font-size: 1.05rem;
        color: #fff;
        outline: none;
        transition: 0.3s;
      }

      body.morning-theme .form-control {
        border-bottom: 2px solid var(--pink-main);
        background: rgba(255, 255, 255, 0.6);
        color: var(--pink-dark);
        font-weight: 600;
      }

      body.morning-theme .form-control:focus,
      body.morning-theme .form-control:valid {
        background: rgba(255, 255, 255, 0.9);
      }

      body.morning-theme .form-label {
        color: var(--pink-dark);
      }

      .form-label {
        position: absolute;
        left: 15px;
        top: 18px;
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.9);
        pointer-events: none;
        transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .form-control:focus ~ .form-label,
      .form-control:valid ~ .form-label {
        top: 0px;
        font-size: 0.75rem;
        color: var(--pink-dark);
        font-weight: 700;
      }

      select.form-control {
        padding-top: 15px;
        appearance: none;
      }

      select.form-control option {
        color: var(--pink-dark);
        background: #fff;
      }

      input[type="datetime-local"]::-webkit-calendar-picker-indicator {
        filter: invert(1);
        opacity: 0.8;
        cursor: pointer;
      }

      body.morning-theme
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
        filter: invert(0);
        opacity: 0.8;
      }

      .toast {
        position: fixed;
        top: -100px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--pink-main);
        padding: 15px 30px;
        border-radius: 30px;
        box-shadow: 0 10px 30px rgba(245, 0, 87, 0.5);
        color: #fff;
        font-weight: 700;
        z-index: 9999;
        font-size: 0.95rem;
        transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        text-align: center;
        width: max-content;
        max-width: 90%;
      }

      .toast.show {
        top: 30px;
      }

      .pass-capture-area {
        background: #fff;
        padding: 15px;
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      .vip-pass {
        background: linear-gradient(135deg, #ffffff 0%, #fff0f3 100%);
        border-radius: 20px;
        width: 100%;
        position: relative;
        overflow: hidden;
        box-shadow: 0 15px 35px rgba(136, 14, 79, 0.15);
        color: var(--pink-dark);
        border: 2px solid var(--pink-soft);
      }

      .vip-pass::before,
      .vip-pass::after {
        content: "";
        position: absolute;
        top: 130px;
        width: 30px;
        height: 30px;
        background: #fff;
        border-radius: 50%;
        z-index: 6;
      }

      .vip-pass::before {
        left: -16px;
        border-right: 2px solid var(--pink-soft);
      }
      .vip-pass::after {
        right: -16px;
        border-left: 2px solid var(--pink-soft);
      }

      .lanyard-hole {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        width: 50px;
        height: 10px;
        border-radius: 10px;
        background: #ffe4e1;
        box-shadow: inset 0 2px 5px rgba(245, 0, 87, 0.3);
        z-index: 5;
      }

      .holo-shine {
        position: absolute;
        top: 0;
        left: -100%;
        width: 50%;
        height: 100%;
        background: linear-gradient(
          to right,
          transparent,
          rgba(255, 255, 255, 0.9),
          transparent
        );
        transform: skewX(-20deg);
        animation: holo 4s infinite;
        z-index: 3;
        pointer-events: none;
      }

      @keyframes holo {
        0%,
        50% {
          left: -100%;
        }
        100% {
          left: 200%;
        }
      }

      .pass-header {
        background: var(--pink-main);
        color: #fff;
        padding: 40px 20px 25px;
        text-align: center;
        border-bottom: 3px dashed var(--pink-light);
        position: relative;
      }

      .pass-header h2 {
        font-family: "Great Vibes", cursive;
        font-size: 2.5rem;
        margin-bottom: 5px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      }

      .pass-header p {
        font-size: 0.75rem;
        letter-spacing: 2.5px;
        font-weight: 700;
        color: var(--pink-light);
      }

      .pass-body {
        padding: 25px 20px;
        position: relative;
        z-index: 4;
      }

      .p-row {
        margin-bottom: 18px;
      }

      .p-label {
        font-size: 0.7rem;
        color: var(--pink-main);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 800;
        font-family: sans-serif;
        opacity: 0.9;
      }

      .p-val {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--pink-dark);
        margin-top: 3px;
      }

      .pass-footer {
        background: var(--pink-light);
        padding: 20px;
        text-align: center;
        border-top: 2px solid #ffb6c1;
      }

      .barcode-vert {
        font-family: "Libre Barcode 39 Text", cursive;
        font-size: 45px;
        color: var(--pink-dark);
      }

      .stamp-pass {
        position: absolute;
        top: 15px;
        right: -5px;
        border: 3px solid var(--pink-main);
        color: var(--pink-main);
        font-size: 0.85rem;
        font-weight: 900;
        font-family: sans-serif;
        padding: 5px 12px;
        border-radius: 8px;
        transform: rotate(-25deg);
        letter-spacing: 1.5px;
        opacity: 0.9;
        z-index: 10;
        background: rgba(255, 255, 255, 0.7);
      }

      .action-btn {
        margin-top: 20px;
        width: 100%;
        background: var(--pink-dark);
        color: #fff;
        box-shadow: 0 8px 20px rgba(136, 14, 79, 0.4);
      }

      .flash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--pink-light);
        z-index: 10001;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }

      .flash-screen.flash {
        opacity: 1;
        pointer-events: all;
      }
    </style>
  </head>
  <body>
    <audio id="bgMusic" loop preload="auto">
      <source src="song.mp3" type="audio/mpeg" />
    </audio>

    <div class="flash-screen" id="flashScreen"></div>

    <div id="cover" onclick="startApp()">
      <div class="heart-btn">💌</div>
      <div class="tap-text">Tap to open</div>
    </div>

    <div class="container">
      <div class="glass-card">
        <div id="phase1" class="phase active">
          <h1 class="title" id="titleText"></h1>

          <div class="polaroid-wrapper">
            <div class="tape"></div>
            <div class="polaroid">
              <img
                src="sorry.png"
                alt="Sorry"
                onerror="
                  this.src =
                    'https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=300&q=80'
                "
              />
            </div>
          </div>

          <div class="typewriter-box">
            <span id="msgText"></span><span class="cursor"></span>
          </div>

          <div class="promise-list">
            <label class="promise-item">
              <input
                type="checkbox"
                class="chk-janji"
                onchange="validatePromises()"
              />
              <span class="heart-icon" data-empty="♡" data-full="♥">♡</span>
              <span>I promise I won't do it again</span>
            </label>
            <label class="promise-item">
              <input
                type="checkbox"
                class="chk-janji"
                onchange="validatePromises()"
              />
              <span class="heart-icon" data-empty="♡" data-full="♥">♡</span>
              <span>I promise to be more understanding</span>
            </label>
            <label class="promise-item">
              <input
                type="checkbox"
                class="chk-janji"
                onchange="validatePromises()"
              />
              <span class="heart-icon" data-empty="♡" data-full="♥">♡</span>
              <span>I promise to do what you want today</span>
            </label>
          </div>

          <div class="btn-group">
            <button
              class="btn btn-secondary"
              id="btnGak"
              ontouchstart="dodge(event)"
              onmouseover="dodge(event)"
            >
              No!
            </button>
            <button
              class="btn btn-primary"
              id="btnMaaf"
              disabled
              onclick="toPhase2()"
            >
              Yes, forgive me
            </button>
          </div>
        </div>

        <div id="phase2" class="phase">
          <h1 class="title" style="color: var(--pink-dark); text-shadow: none">
            Thank you, sweetheart! 💕
          </h1>
          <p
            style="
              text-align: center;
              font-size: 0.95rem;
              margin-bottom: 25px;
              font-style: italic;
              color: var(--pink-main);
            "
          >
            As an apology, let's go out together...
          </p>

          <div class="form-group">
            <input type="text" id="fFood" class="form-control" required />
            <label class="form-label">Your Favorite Food</label>
          </div>
          <div class="form-group">
            <input
              type="datetime-local"
              id="fDate"
              class="form-control"
              required
            />
            <label class="form-label">Date & Time</label>
          </div>
          <div class="form-group">
            <input type="text" id="fLoc" class="form-control" required />
            <label class="form-label">Destination</label>
          </div>
          <div class="form-group">
            <select id="fAct" class="form-control" required>
              <option value="" disabled selected></option>
              <option value="Go to the Movies">Go to the Movies 🍿</option>
              <option value="Explore the City">Explore the City 🚗</option>
              <option value="Romantic Dinner">Romantic Dinner 🍽️</option>
              <option value="Shopping & Chill">Shopping & Chill 🛍️</option>
            </select>
            <label class="form-label">Main Activity</label>
          </div>

          <button
            class="btn btn-primary glow"
            style="width: 100%; margin-top: 15px; padding: 16px"
            onclick="submitDate()"
          >
            Create Date Plan
          </button>
        </div>

        <div id="phase3" class="phase">
          <div class="pass-capture-area" id="captureArea">
            <div class="vip-pass">
              <div class="lanyard-hole"></div>
              <div class="holo-shine"></div>

              <div class="pass-header">
                <h2>Love Pass</h2>
                <p>EXCLUSIVE FOR LYSTIANI VANIA LALITA</p>
              </div>

              <div class="pass-body">
                <div class="stamp-pass">FORGIVEN</div>
                <div class="p-row">
                  <div class="p-label">Activity & Food</div>
                  <div class="p-val" id="tAct"></div>
                </div>
                <div class="p-row">
                  <div class="p-label">VIP Time</div>
                  <div class="p-val" id="tDate"></div>
                </div>
                <div class="p-row">
                  <div class="p-label">Date Location</div>
                  <div class="p-val" id="tLoc"></div>
                </div>
                <div class="p-row" style="margin-bottom: 0; margin-top: 25px">
                  <div class="p-label">Issued By</div>
                  <div
                    class="p-val"
                    style="
                      font-family: &quot;Great Vibes&quot;, cursive;
                      font-size: 1.8rem;
                      color: var(--pink-main);
                    "
                  >
                    Al
                  </div>
                </div>
              </div>

              <div class="pass-footer">
                <div class="barcode-vert">LVL-DATE</div>
              </div>
            </div>
          </div>

          <button class="btn action-btn" onclick="downloadPass()">
            Save Ticket 📸
          </button>
        </div>
      </div>
    </div>

    <div class="toast" id="toastMsg"></div>

    <script>
      document.addEventListener("touchmove", (e) => {
        const touch = e.touches[0];
        createSparkle(touch.clientX, touch.clientY);
      });
      document.addEventListener("mousemove", (e) => {
        createSparkle(e.clientX, e.clientY);
      });

      function createSparkle(x, y) {
        if (Math.random() > 0.3) return;
        const el = document.createElement("div");
        el.className = "magic-sparkle";
        el.innerText = ["✨", "💖", "🌸"][Math.floor(Math.random() * 3)];
        el.style.left = x - 10 + "px";
        el.style.top = y - 10 + "px";
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
      }

      setInterval(() => {
        const petal = document.createElement("div");
        petal.className = "falling-petal";
        petal.style.left = Math.random() * 100 + "vw";
        const dur = Math.random() * 6 + 6;
        petal.style.animationDuration = dur + "s";
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), dur * 1000);
      }, 800);

      const t1 = "Please forgive me, my love,\nLystiani Vania Lalita...";
      const t2 =
        "I realize that I upset you, and this was completely my fault. God willing, the mistake I made yesterday will be the last one. I am truly sorry, my love. I don't know how else to apologize to you. I love you, my love. ❤️";

      let i1 = 0,
        i2 = 0;

      function runTypewriter() {
        if (i1 < t1.length) {
          document.getElementById("titleText").innerText += t1.charAt(i1);
          i1++;
          setTimeout(runTypewriter, 50);
        } else {
          setTimeout(runMsg, 400);
        }
      }

      function runMsg() {
        if (i2 < t2.length) {
          document.getElementById("msgText").innerText += t2.charAt(i2);
          i2++;
          setTimeout(runMsg, 40);
        }
      }

      function startApp() {
        document.getElementById("cover").style.opacity = "0";
        setTimeout(() => {
          document.getElementById("cover").style.display = "none";
          document
            .getElementById("bgMusic")
            .play()
            .catch((e) => {});
          runTypewriter();
        }, 800);
      }

      function validatePromises() {
        const chks = document.querySelectorAll(".chk-janji");
        const btn = document.getElementById("btnMaaf");
        let all = true;
        chks.forEach((c) => {
          const icon = c.nextElementSibling;
          if (c.checked) {
            icon.innerText = icon.getAttribute("data-full");
            icon.style.color = "var(--pink-main)";
          } else {
            icon.innerText = icon.getAttribute("data-empty");
            icon.style.color = "#fff";
            all = false;
          }
        });
        btn.disabled = !all;
        if (all) btn.classList.add("glow");
        else btn.classList.remove("glow");
      }

      function dodge(e) {
        e.preventDefault();
        const btn = document.getElementById("btnGak");

        const maxX = 60;
        const maxY = 70;

        const moveX =
          (Math.random() > 0.5 ? 1 : -1) * (Math.random() * maxX + 20);
        const moveY =
          (Math.random() > 0.5 ? 1 : -1) * (Math.random() * maxY + 20);

        btn.style.transform = `translate(${moveX}px, ${moveY}px)`;
      }

      function toPhase2() {
        const flash = document.getElementById("flashScreen");
        flash.classList.add("flash");

        setTimeout(() => {
          document.body.classList.add("morning-theme");
          document.getElementById("phase1").classList.remove("active");
          document.getElementById("phase2").classList.add("active");

          const card = document.querySelector(".glass-card");
          card.style.background = "rgba(255, 255, 255, 0.4)";
          card.style.border = "1px solid rgba(255, 192, 203, 0.8)";

          flash.classList.remove("flash");
          shootConfetti();
        }, 600);
      }

      function shootConfetti() {
        const end = Date.now() + 3500;
        (function frame() {
          confetti({
            particleCount: 5,
            angle: 60,
            spread: 55,
            origin: { x: 0 },
            colors: ["#f50057", "#ffffff", "#ffb6c1"],
          });
          confetti({
            particleCount: 5,
            angle: 120,
            spread: 55,
            origin: { x: 1 },
            colors: ["#f50057", "#ffffff", "#ffb6c1"],
          });
          if (Date.now() < end) requestAnimationFrame(frame);
        })();
      }

      function showToast(msg) {
        const t = document.getElementById("toastMsg");
        t.innerText = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 3500);
      }

      function submitDate() {
        const f = document.getElementById("fFood").value;
        const d = document.getElementById("fDate").value;
        const l = document.getElementById("fLoc").value;
        const a = document.getElementById("fAct").value;

        if (!f || !d || !l || !a) {
          showToast("Please fill in everything first, my love! 🥺");
          return;
        }

        document.getElementById("tAct").innerText = `${a} & ${f}`;

        const dateObj = new Date(d);
        const opt = {
          day: "numeric",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        };
        document.getElementById("tDate").innerText = dateObj
          .toLocaleDateString("en-US", opt)
          .replace(",", " |");
        document.getElementById("tLoc").innerText = l;

        showToast("Yay! Our date plan has been created successfully! 🎉");

        const p2 = document.getElementById("phase2");
        const p3 = document.getElementById("phase3");
        p2.style.opacity = "0";
        setTimeout(() => {
          p2.classList.remove("active");
          p3.classList.add("active");
        }, 600);
      }

      function downloadPass() {
        const el = document.getElementById("captureArea");

        html2canvas(el, {
          scale: 3,
          backgroundColor: "#fff",
          useCORS: true,
          logging: false,
        }).then((canvas) => {
          const imageURL = canvas.toDataURL("image/png");
          
          // Solusi Universal HP (Android & iPhone / Safari)
          // Membuka tab baru yang menampilkan gambar tiket agar user bisa Long-Press (Tekan & Tahan) untuk menyimpan ke galeri
          let win = window.open();
          if (win) {
            win.document.write(`
              <!DOCTYPE html>
              <html>
              <head>
                <title>Save Ticket</title>
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
              </head>
              <body style="background:#111; margin:0; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; font-family:sans-serif; color:#fff; text-align:center; padding:20px;">
                <p style="font-size:15px; margin-bottom:15px; line-height:1.5;">Press and hold the image below, then choose <b>"Save Image"</b> or <b>"Download Image"</b>:</p>
                <img src="${imageURL}" style="width:100%; max-width:380px; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,0.5);"/>
              </body>
              </html>
            `);
          } else {
            // Fallback jika pop-up diblokir browser
            let link = document.createElement("a");
            link.download = "Love_Pass_Vania.png";
            link.href = imageURL;
            link.click();
          }
        }).catch(err => {
          showToast("Could not save the ticket. Please take a screenshot manually!");
        });
      }
    </script>
  </body>
</html>
